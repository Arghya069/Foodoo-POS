# Local Docker smoke test. Requires local Application Default Credentials.
# Use "gcloud auth application-default login" outside Docker before starting.
services:
  api:
    build: ./fastapi_backend
    ports:
      - "127.0.0.1:8001:8080"
    env_file: ./fastapi_backend/.env
    environment:
      GOOGLE_APPLICATION_CREDENTIALS: /credentials/adc.json
      FOODOO_COOKIE_SECURE: "false"
      FOODOO_ALLOWED_ORIGINS: "http://localhost:8088"
    volumes:
      - "${HOME}/.config/gcloud/application_default_credentials.json:/credentials/adc.json:ro"
  web:
    build: ./frontend
    ports:
      - "127.0.0.1:8088:80"
    depends_on:
      - api
